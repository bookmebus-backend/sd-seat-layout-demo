document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

>\n                <sc-for list=\"{{ pickedChips }}\" as=\"p\" hint-placeholder-count=\"2\">\n                  <span style=\"display:flex;align-items:center;gap:6px;background:rgba(243,108,51,.09);border:1px solid rgba(243,108,51,.4);border-radius:9999px;padding:5px 11px;font-size:11px;color:#ED5824;font-weight:600;animation:popIn .25s ease-out\">{{ p.label }}<span onclick=\"{{ p.onRemove }}\" style=\"cursor:pointer;color:#F36C33;font-size:12px;line-height:1\">✕<\u002Fspan><\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button onclick=\"{{ onToCheckout }}\" style=\"width:100%;height:52px;border:none;border-radius:9999px;background:{{ ctaBg }};color:{{ ctaColor }};font-family:'Avant Garde',Arial,sans-serif;font-size:14px;cursor:{{ ctaCursor }};transition:all .25s ease-out;box-shadow:{{ ctaShadow }}\" style-active=\"transform:scale(.97)\">{{ ctaLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Checkout -->\n        <div style=\"display:{{ checkoutDisplay }};flex:1;min-height:0;flex-direction:column\">\n          <div style=\"padding:18px 22px 0;animation:riseIn .3s ease-out;display:flex;flex-direction:column;flex:1;font-family:'Nokora',Arial,sans-serif\">\n            <div style=\"font-size:10px;letter-spacing:.16em;color:#9198AE;font-weight:600;margin-bottom:12px\">ORDER SUMMARY<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ orderLines }}\" as=\"ol\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;justify-content:space-between;font-size:13px;gap:12px\"><span style=\"color:#4A4A6A;min-width:0\">{{ ol.label }}<\u002Fspan><span style=\"color:#1A1A2E;font-weight:600;flex:none\">{{ ol.amount }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"height:1px;background:#F0F2F5;margin:14px 0\"><\u002Fdiv>\n            <div onclick=\"{{ onToggleCredit }}\" style=\"display:flex;align-items:center;gap:11px;cursor:pointer;padding:2px 0\">\n              <span style=\"width:20px;height:20px;flex:none;border-radius:6px;border:1.5px solid {{ creditBorder }};background:{{ creditBg }};display:flex;align-items:center;justify-content:center;transition:all .15s\">\n                <svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"opacity:{{ checkOpacity }}\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <span style=\"font-size:13px;color:#1A1A2E\">Use store credit<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:13px;color:#27AE60;font-weight:600\">{{ creditAmount }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:1px;background:#F0F2F5;margin:14px 0\"><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:11px\">\n              <span style=\"width:34px;height:24px;flex:none;border-radius:5px;background:linear-gradient(135deg,#1A1A2E,#4A4A6A);display:flex;align-items:center;justify-content:center\"><span style=\"font-size:8px;color:#fff;font-weight:700;letter-spacing:.05em\">VISA<\u002Fspan><\u002Fspan>\n              <span style=\"font-size:13px;color:#1A1A2E\">Visa •••• 4421<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:11px;color:#27AE60;font-weight:600\">✓ Verified<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:{{ reservedDisplay }};gap:11px;align-items:center;margin-top:16px;background:#F7F8FA;border:1px dashed #C9CEDB;border-radius:12px;padding:11px 13px\">\n              <div style=\"display:flex;flex:none\">\n                <sc-for list=\"{{ reservedThumbs }}\" as=\"rt\" hint-placeholder-count=\"3\">\n                  <img loading=\"lazy\" src=\"{{ rt.img }}\" alt=\"held item\" style=\"width:30px;height:30px;border-radius:8px;object ight=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1389AF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v4l2.5 2.5\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:11px;color:#1389AF;line-height:1.5\">Track this order anytime in <b>Bookings → Merch<\u002Fb> — we'll ping you at every hop from Seoul.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"width:100%;margin-top:auto;padding-top:16px;padding-bottom:4px;display:flex;flex-direction:column;gap:9px\">\n              <button onclick=\"{{ onViewTicket }}\" style=\"height:48px;border:none;border-radius:9999px;background:linear-gradient(135deg,#2EBAE2,#1389AF);color:#fff;font-family:'Avant Garde',Arial,sans-serif;font-size:13px;cursor:pointer\" style-active=\"transform:scale(.97)\">View my e-ticket<\u002Fbutton>\n              <button onclick=\"{{ onReset }}\" style=\"height:44px;border:1px solid #E5E8EF;border-radius:9999px;background:#fff;color:#1389AF;font-size:13px;font-weight:600;cursor:pointer;font-family:'Nokora',Arial,sans-serif\" style-hover=\"background:#F7F8FA\" style-active=\"transform:scale(.97)\">Back to home<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- WHILE-YOU-WAIT SHEET -->\n      <div onclick=\"{{ onCloseSheet }}\" style=\"position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:{{ scrimOpacity }};pointer-events:{{ scrimEvents }};z-index:20\"><\u002Fdiv>\n      <div data-screen-label=\"While You Wait Sheet\" style=\"position:absolute;left:0;right:0;bottom:0;transform:translateY({{ sheetY }});background:#FFFFFF;border-radius:24px 24px 0 0;z-index:21;box-shadow:0 -8px 32px rgba(0,0,0,.12);max-height:82%;overflow-y:auto\">\n        <div style=\"position:sticky;top:0;z-index:2;background:#FFFFFF;border-radius:24px 24px 0 0;padding:10px 22px 12px;box-shadow:0 1px 0 #F0F2F5\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between\">\n            <span style=\"width:30px;flex:none\"><\u002Fspan>\n            <span style=\"width:44px;height:5px;border-radius:9999px;background:#E5E8EF\"><\u002Fspan>\n            <button onclick=\"{{ onCloseSheet }}\" style=\"width:30px;height:30px;flex:none;border-radius:50%;border:none;background:#F0F2F5;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#E5E8EF\">\n              <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#4A4A6A\" stroke-width=\"2.6\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-family:'Avant Garde',Arial,sans-serif;font-size:16px;color:#1A1A2E;margin-top:6px\">While you wait…<\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#9198AE;margin-top:2px\">Browsing won't cost you your place in line.<\u002Fdiv>\n          <div style=\"display:flex;gap:4px;background:#F0F2F5;border-radius:12px;padding:4px;margin-top:12px\">\n            <button onclick=\"{{ onTabTickets }}\" style=\"flex:1;height:34px;border:none;border-radius:9px;background:{{ ticketsTabBg }};color:{{ ticketsTabColor }};font-size:12px;font-weight:700;cursor:pointer;font-family:'Nokora',Arial,sans-serif;box-shadow:{{ ticketsTabShadow }};transition:all .2s\">Tickets &amp; seat map<\u002Fbutton>\n            <button onclick=\"{{ onTabFan }}\" style=\"flex:1;height:34px;border:none;border-radius:9px;background:{{ fanTabBg }};color:{{ fanTabColor }};font-size:12px;font-weight:700;cursor:pointer;font-family:'Nokora',Arial,sans-serif;box-shadow:{{ fanTabShadow }};transition:all .2s\">Fan zone · merch<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:{{ ticketsTabDisplay }};flex-direction:column\">\n          <div style=\"padding:24px 24px 0;font-family:'Nokora',Arial,sans-serif;animation:riseIn .3s ease-out\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n              <div style=\"font-family:'Avant Garde',Arial,sans-serif;font-size:15px;color:#1A1A2E\">Preview tickets &amp; seat map<\u002Fdiv>\n              <span style=\"font-size:9px;letter-spacing:.14em;font-weight:700;color:#27AE60;background:rgba(39,174,96,.10);border-radius:9999px;padding:4px 9px;flex:none\">SPOT SAFE<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#9198AE;margin-top:4px;line-height:1.5\">Browse prices and stage views while you wait — this won't affect your place in line.<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px\">\n              <sc-for list=\"{{ previewTiers }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <button onclick=\"{{ t.onPick }}\" style=\"display:flex;align-items:center;gap:8px;border:1.5px solid {{ t.border }};border-radius:12px;background:{{ t.bg }};padding:10px 12px;cursor:pointer;text-align:left;transition:all .15s;font-family:'Nokora',Arial,sans-serif\" style-active=\"transform:scale(.97)\">\n                  <span style=\"width:11px;height:11px;flex:none;border-radius:4px;background:{{ t.color }}\"><\u002Fspan>\n                  <span style=\"min-width:0\">\n                    <span style=\"display:block;font-size:11.5px;color:#1A1A2E;font-weight:600;white-space:nowrap\">{{ t.name }}<\u002Fspan>\n                    <span style=\"display:block;font-size:10px;color:#9198AE;margin-top:1px\">{{ t.price }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"border:1px solid #F0F2F5;border-radius:16px;margin-top:12px;padding:12px 8px 6px;background:#FBFCFD\">\n              <svg viewBox=\"0 0 320 272\" style=\"width:100%;display:block\">\n                <defs><linearGradient id=\"pvStageGrad\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#2EBAE2\"><\u002Fstop><stop offset=\"1\" stop-color=\"#1389AF\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n                <rect x=\"108\" y=\"26\" width=\"104\" height=\"52\" rx=\"10\" fill=\"url(#pvStageGrad)\"><\u002Frect>\n                <text x=\"160\" y=\"57\" fill=\"#fff\" font-size=\"10\" text-anchor=\"middle\" style=\"letter-spacing:.3em;font-family:'Avant Garde',Arial,sans-serif\">STAGE<\u002Ftext>\n                <sc-for list=\"{{ previewShapes }}\" as=\"s\" hint-placeholder-count=\"20\">\n                  <path d=\"{{ s.d }}\" fill=\"{{ s.fill }}\" opacity=\"{{ s.opacity }}\" stroke=\"#FFFFFF\" stroke-width=\"1.5\" onclick=\"{{ s.onPick }}\" style=\"cursor:pointer;transition:opacity .25s\"><\u002Fpath>\n                <\u002Fsc-for>\n                <sc-for list=\"{{ previewLabels }}\" as=\"l\" hint-placeholder-count=\"20\">\n                  <text x=\"{{ l.x }}\" y=\"{{ l.y }}\" fill=\"{{ l.fill }}\" opacity=\"{{ l.opacity }}\" font-size=\"{{ l.size }}\" text-anchor=\"middle\" font-weight=\"600\" style=\"pointer-events:none;transition:opacity .25s;font-family:'Nokora',Arial,sans-serif\">{{ l.t }}<\u002Ftext>\n                <\u002Fsc-for>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px\">\n              <div style=\"min-width:0\">\n                <div style=\"font-size:12.5px;font-weight:700;color:#1A1A2E\">{{ previewTitle }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:#9198AE;margin-top:2px\">{{ previewDesc }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:'Avant Garde',Arial,sans-serif;font-size:16px;color:#ED5824;flex:none\">{{ previewPrice }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:26px\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:{{ fanTabDisplay }};flex-direction:column\">\n          <div style=\"padding:18px 22px 30px;font-family:'Nokora',Arial,sans-serif\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px\">\n              <span style=\"font-size:10px;letter-spacing:.14em;color:#9198AE;font-weight:600\">OFFICIAL TOUR MERCH · EARLY ACCESS<\u002Fspan>\n              <span style=\"font-size:10.5px;color:#ED5824;font-weight:600\">Queue-only drop<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n              <sc-for list=\"{{ merch }}\" as=\"m\" hint-placeholder-count=\"4\">\n                <div style=\"background:#FFFFFF;border:1px solid #E5E8EF;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;flex-direction:column\">\n                  <div style=\"position:relative;background:#F4F4F6\">\n                    <img loading=\"lazy\" src=\"{{ m.img }}\" alt=\"{{ m.name }}\" style=\"display:block;width:100%;aspect-ratio:1;object-fit:cover\">\n                    <span style=\"position:absolute;top:8px;left:8px;background:rgba(46,186,226,.12);color:#1389AF;font-size:8.5px;font-weight:700;border-radius:4px;padding:3px 6px;letter-spacing:.04em;border:1px solid rgba(46,186,226,.4)\">{{ m.badge }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"padding:10px 12px 12px;display:flex;flex-direction:column;flex:1\">\n                    <div style=\"font-size:11.5px;color:#1A1A2E;font-weight:600;line-height:1.35;min-height:31px\">{{ m.name }}<\u002Fdiv>\n                    <div style=\"display:flex;align-items:baseline;gap:5px;margin-top:4px\"><span style=\"font-size:9.5px;color:#9198AE;font-weight:600\">USD<\u002Fspan><span style=\"font-size:14px;color:#1A1A2E;font-weight:700\">{{ m.price }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"font-size:9.5px;color:#9198AE;margin-top:2px\">✈ Shipped from KR<\u002Fdiv>\n                    <button onclick=\"{{ m.onHold }}\" style=\"margin-top:10px;width:100%;height:34px;border-radius:9999px;border:1px solid {{ m.btnBorder }};background:{{ m.btnBg }};color:{{ m.btnColor }};font-size:11px;font-weight:600;cursor:pointer;font-family:'Nokora',Arial,sans-serif\" style-active=\"transform:scale(.97)\">{{ m.btnLabel }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:{{ holdBannerDisplay }};gap:11px;align-items:flex-start;margin-top:16px;background:rgba(39,174,96,.07);border:1px solid rgba(39,174,96,.35);border-radius:12px;padding:13px 15px;animation:riseIn .3s ease-out\">\n              <span style=\"width:30px;height:30px;flex:none;border-radius:50%;background:rgba(39,174,96,.14);display:flex;align-items:center;justify-content:center\">\n                <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#27AE60\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z\"><\u002Fpath><path d=\"M3 6h18\"><\u002Fpath><path d=\"M16 10a4 4 0 0 1-8 0\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <div>\n                <div style=\"font-size:12px;color:#1A7A44;font-weight:700\">{{ holdBannerTitle }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:#4A4A6A;line-height:1.55;margin-top:3px\">No address or payment needed now — tickets always come first. We'll bring these back <b>right after checkout<\u002Fb> to finish in one tap.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    progress: 0, running: false, paused: false, sheet: false, sheetPos: 0, seatView: false,\n    previewZone: 'vip', sheetTab: 'tickets', confIdx: 0,\n    held: {},\n    mapStep: 'zones', zone: null, section: null, picked: [],\n    holdSecs: 480, useCredit: true, payState: 'idle',\n    shipOpt: 'standard', merchPayState: 'idle'\n  };\n\n  componentDidMount() {\n    this.iv = setInterval(() => this.tick(), 90);\n    this.holdIv = setInterval(() => {\n      const s = this.state;\n      if (s.seatView && s.payState !== 'done' && s.holdSecs > 0) this.setState({ holdSecs: s.holdSecs - 1 });\n    }, 1000);\n  }\n  componentWillUnmount() { clearInterval(this.iv); clearInterval(this.holdIv); clearTimeout(this.morphT); clearTimeout(this.payT); clearTimeout(this.merchPayT); cancelAnimationFrame(this.sheetRaf); }\n\n  tick() {\n    const { running, paused, progress, seatView } = this.state;\n    if (!running || paused || seatView) return;\n    let p = progress + 0.45;\n    if (p >= 100) {\n      this.setState({ progress: 100, running: false });\n      clearTimeout(this.morphT);\n      this.morphT = setTimeout(() => this.setState({ seatView: true, mapStep: 'zones', holdSecs: 480 }), 900);\n    } else {\n      this.setState({ progress: p });\n    }\n  }\n\n  toggleSheet(tab) {\n    const s = this.state;\n    if (s.sheet && s.sheetTab !== tab) { this.setState({ sheetTab: tab }); return; }\n    const open = !s.sheet;\n    this.setState({ sheet: open, sheetTab: tab });\n    this.animateSheet(open ? 1 : 0);\n  }\n\n  animateSheet(target) {\n    cancelAnimationFrame(this.sheetRaf);\n    const start = this.state.sheetPos, t0 = performance.now(), dur = 300;\n    const step = (t) => {\n      let k = Math.min(1, (t - t0) / dur);\n      k = 1 - Math.pow(1 - k, 3);\n      this.setState({ sheetPos: start + (target - start) * k });\n      if (k < 1) this.sheetRaf = requestAnimationFrame(step);\n    };\n    this.sheetRaf = requestAnimationFrame(step);\n  }\n\n  arc(cx, cy, r1, r2, a0, a1) {\n    const p = (r, a) => (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1);\n    const lg = (a1 - a0) > Math.PI ? 1 : 0;\n    return 'M ' + p(r2, a0) + ' A ' + r2 + ' ' + r2 + ' 0 ' + lg + ' 1 ' + p(r2, a1) +\n           ' L ' + p(r1, a1) + ' A ' + r1 + ' ' + r1 + ' 0 ' + lg + ' 0 ' + p(r1, a0) + ' Z';\n  }\n\n  mapGeometry() {\n    const cx = 160, cy = 132;\n    const opening = 64 * Math.PI / 180;\n    const a0 = -Math.PI / 2 + opening / 2;\n    const sweep = 2 * Math.PI - opening;\n    const shapes = [], labels = [];\n    shapes.push({ zone: 'vip', d: 'M 122 86 h 76 a 8 8 0 0 1 8 8 v 14 a 8 8 0 0 1 -8 8 h -76 a 8 8 0 0 1 -8 -8 v -14 a 8 8 0 0 1 8 -8 Z' });\n    labels.push({ zone: 'vip', x: '160', y: '105', t: 'VIP PIT', fill: '#fff', size: '9' });\n    shapes.push({ zone: 'floor', d: 'M 116 122 h 88 a 8 8 0 0 1 8 8 v 36 a 8 8 0 0 1 -8 8 h -88 a 8 8 0 0 1 -8 -8 v -36 a 8 8 0 0 1 8 -8 Z' });\n    labels.push({ zone: 'floor', x: '160', y: '147', t: 'FLOOR', fill: '#fff', size: '9' });\n    for (let i = 0; i < 8; i++) {\n      const s0 = a0 + sweep * i / 8, s1 = a0 + sweep * (i + 1) / 8;\n      shapes.push({ zone: 'lower', d: this.arc(cx, cy, 58, 88, s0, s1) });\n      const am = (s0 + s1) / 2, rm = 73;\n      labels.push({ zone: 'lower', x: (cx + rm * Math.cos(am)).toFixed(1), y: (cy + rm * Math.sin(am) + 3).toFixed(1), t: String(101 + i), fill: '#fff', size: '8.5' });\n    }\n    for (let i = 0; i < 10; i++) {\n      const s0 = a0 + sweep * i / 10, s1 = a0 + sweep * (i + 1) / 10;\n      shapes.push({ zone: 'upper', d: this.arc(cx, cy, 96, 130, s0, s1) });\n      const am = (s0 + s1) / 2, rm = 113;\n      labels.push({ zone: 'upper', x: (cx + rm * Math.cos(am)).toFixed(1), y: (cy + rm * Math.sin(am) + 3).toFixed(1), t: String(201 + i), fill: '#1389AF', size: '8.5' });\n    }\n    return { shapes, labels };\n  }\n\n  zoneDefs() {\n    return {\n      vip:   { name: 'VIP Pit',    price: 289, color: '#ED5824' },\n      floor: { name: 'Floor',      price: 189, color: '#F5905F' },\n      lower: { name: 'Lower Bowl', price: 129, color: '#2EBAE2' },\n      upper: { name: 'Upper Bowl', price: 79,  color: '#A8DEF0' }\n    };\n  }\n\n  merchDefs() {\n    return [\n      { key: 'army',    name: 'Official Light Stick Ver.4 Parts (ARMY ver.)', price: 7.15,  img: (window.__resources && window.__resources.merchArmy) || '../assets/merch/lightstick-army.png',   badge: 'PRE-ORDER' },\n      { key: 'cradle',  name: 'Official Light Stick Ver.4 Cradle',            price: 17.88, img: (window.__resources && window.__resources.merchCradle) || '../assets/merch/lightstick-cradle.png', badge: 'PRE-ORDER' },\n      { key: 'jacket',  name: 'Wind Jacket (SWIM)',                           price: 92.29, img: (window.__resources && window.__resources.merchJacket) || '../assets/merch/windjacket.png',        badge: 'EXCLUSIVE' },\n      { key: 'keyring', name: 'Official Light Stick Keyring Ver.4',           price: 17.88, img: (window.__resources && window.__resources.merchKeyring) || '../assets/merch/keyring.png',           badge: 'PRE-ORDER' }\n    ];\n  }\n\n  sectionsOf(zone) {\n    if (zone === 'vip') return [{ id: 'PIT L', gate: 'Floor Gate A' }, { id: 'PIT R', gate: 'Floor Gate A' }];\n    if (zone === 'floor') return ['A', 'B', 'C', 'D'].map(x => ({ id: 'Floor ' + x, gate: 'Floor Gate B' }));\n    if (zone === 'lower') return Array.from({ length: 8 }, (_, i) => ({ id: String(101 + i), gate: 'Gate ' + (1 + (i >> 1)) }));\n    return Array.from({ length: 10 }, (_, i) => ({ id: String(201 + i), gate: 'Gate ' + (5 + (i >> 1)) }));\n  }\n\n  seatsLeft(id) { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 997; return 8 + (h % 34); }\n\n  renderVals() {\n    const { progress, running, paused, sheet, sheetPos, seatView, held,\n            mapStep, zone, section, picked, holdSecs, useCredit, payState,\n            shipOpt, merchPayState } = this.state;\n    const pct = Math.round(progress);\n    const initialWait = 10;\n    const zones = this.zoneDefs();\n\n    const stageDefs = [\n      { label: 'Waiting R
